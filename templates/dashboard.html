<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — VoiceLog</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-mesh"></div>
  <nav class="nav">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">🎙️</div>
      <span class="nav-logo-text">VoiceLog</span>
    </a>
    <div class="flex items-center gap-4">
      <span class="text-sub text-sm">{{ user.name }}</span>
      <a href="/auth/logout" class="btn btn-outline btn-sm">Logout</a>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <span class="sidebar-section-label">Navigation</span>
      <a href="/dashboard" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/app-view" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg>
        App Recorder
      </a>
      <div class="sidebar-bottom">
        <div class="divider"></div>
        <a href="/auth/logout" class="sidebar-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </a>
      </div>
    </aside>

    <main class="main-content fade-in">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h1 style="font-size:1.8rem;">Sessions</h1>
          <p class="text-sub text-sm mt-1">Manage your recording sessions</p>
        </div>
        <button class="btn btn-primary" id="openCreateModal">+ New Session</button>
      </div>

      <!-- Stats row -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;" id="statsRow">
        <div class="card p-4">
          <div class="text-muted text-xs mb-1" style="text-transform:uppercase;letter-spacing:.06em;">Total</div>
          <div style="font-size:1.8rem;font-weight:700;font-family:'Syne',sans-serif;" id="statTotal">—</div>
        </div>
        <div class="card p-4">
          <div class="text-muted text-xs mb-1" style="text-transform:uppercase;letter-spacing:.06em;">Completed</div>
          <div style="font-size:1.8rem;font-weight:700;font-family:'Syne',sans-serif;color:var(--green);" id="statCompleted">—</div>
        </div>
        <div class="card p-4">
          <div class="text-muted text-xs mb-1" style="text-transform:uppercase;letter-spacing:.06em;">Processing</div>
          <div style="font-size:1.8rem;font-weight:700;font-family:'Syne',sans-serif;color:var(--teal);" id="statProcessing">—</div>
        </div>
        <div class="card p-4">
          <div class="text-muted text-xs mb-1" style="text-transform:uppercase;letter-spacing:.06em;">Created</div>
          <div style="font-size:1.8rem;font-weight:700;font-family:'Syne',sans-serif;color:var(--text-sub);" id="statCreated">—</div>
        </div>
      </div>

      <!-- Sessions Table -->
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Session Name</th>
                <th>Interviewer</th>
                <th>Time</th>
                <th>Status</th>
                <th>Created</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="sessionsTable">
              <tr><td colspan="6" class="empty-state"><div class="icon">🎙️</div><div>Loading sessions...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Session Modal -->
  <div id="createModal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;">
    <div class="card" style="width:100%;max-width:480px;padding:2rem;">
      <div class="flex justify-between items-center mb-6">
        <h2 style="font-size:1.3rem;">New Session</h2>
        <button onclick="closeModal()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.2rem;">✕</button>
      </div>
      <form id="createForm" style="display:flex;flex-direction:column;gap:1rem;">
        <div class="form-group">
          <label class="form-label">Session Name *</label>
          <input type="text" id="sessionName" class="form-input" placeholder="e.g. Product Interview Q3" required>
        </div>
        <div class="form-group">
          <label class="form-label">Interviewer *</label>
          <input type="text" id="interviewer" class="form-input" placeholder="e.g. Sarah Johnson" required>
        </div>
        <div class="form-group">
          <label class="form-label">Date & Time *</label>
          <input type="datetime-local" id="sessionTime" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea id="notes" class="form-textarea" placeholder="Optional notes about this session..."></textarea>
        </div>
        <div class="flex gap-4 mt-2">
          <button type="button" onclick="closeModal()" class="btn btn-outline" style="flex:1;justify-content:center;">Cancel</button>
          <button type="submit" class="btn btn-primary" id="createBtn" style="flex:1;justify-content:center;">Create Session</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/session.js') }}"></script>
</body>
</html>
