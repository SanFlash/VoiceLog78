<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VoiceLog</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="login-wrap fade-in">
    <div class="card login-card">
      <div class="login-logo">
        <div class="login-logo-icon">🎙️</div>
        <span style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.2rem;">VoiceLog</span>
      </div>
      <h2 style="font-size:1.6rem;margin-bottom:0.5rem;">Welcome back</h2>
      <p class="text-sub text-sm mb-6">Sign in to access your dashboard</p>

      <div class="demo-hint">
        Demo credentials → <span>demo@test.com</span> / <span>demo123</span>
      </div>

      <form id="loginForm" style="display:flex;flex-direction:column;gap:1rem;">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" value="demo@test.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" value="demo123" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary w-full" style="justify-content:center;margin-top:0.5rem;" id="loginBtn">
          Sign In
        </button>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <div id="errorMsg" class="error-msg" style="display:none;"></div>
      </form>

      <div class="divider"></div>
      <a href="/" class="btn btn-outline btn-sm w-full" style="justify-content:center;">← Back to Home</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.innerHTML = '<span class="spinner"></span> Signing in...';
      btn.disabled = true;

      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.redirect || '/dashboard';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').textContent = data.message || 'Invalid credentials';
        btn.innerHTML = 'Sign In'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
