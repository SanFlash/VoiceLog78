<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App — VoiceLog</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="bg-mesh"></div>
  <nav class="nav">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">🎙️</div>
      <span class="nav-logo-text">VoiceLog</span>
    </a>
    <a href="/" class="btn btn-outline btn-sm">← Home</a>
  </nav>

  <div class="app-sim-wrap fade-in" style="padding-top:80px;">
    <div class="phone-frame">
      <div class="phone-notch"><div class="phone-notch-bar"></div></div>
      
      <!-- Login Screen -->
      <div class="phone-body" id="appLoginScreen">
        <div style="text-align:center;margin-top:1rem;">
          <div style="font-size:2.5rem;margin-bottom:1rem;">🎙️</div>
          <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.4rem;">VoiceLog</div>
          <div style="font-size:0.8rem;color:var(--text-sub);margin-top:0.5rem;">App Recorder</div>
        </div>
        <div class="demo-hint mt-4" style="font-size:0.78rem;">
          Demo: <span>demo@test.com</span> / <span>demo123</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1rem;">
          <div class="form-group">
            <label class="form-label" style="font-size:0.72rem;">Email</label>
            <input type="email" id="appEmail" class="form-input" value="demo@test.com" style="font-size:0.85rem;">
          </div>
          <div class="form-group">
            <label class="form-label" style="font-size:0.72rem;">Password</label>
            <input type="password" id="appPassword" class="form-input" value="demo123" style="font-size:0.85rem;">
          </div>
          <button class="btn btn-primary w-full" style="justify-content:center;margin-top:0.5rem;" onclick="appLogin()">Sign In</button>
          <div id="appLoginError" style="display:none;color:var(--red);font-size:0.78rem;text-align:center;"></div>
        </div>
      </div>

      <!-- Main Screen (hidden until login) -->
      <div class="phone-body" id="appMainScreen" style="display:none;">
        <div class="phone-header">
          <div class="phone-title">Sessions</div>
          <button class="btn btn-primary btn-sm" onclick="showNewSessionModal()">+ New</button>
        </div>
        
        <div style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;">Recent Sessions</div>
        <div id="appSessionList" style="display:flex;flex-direction:column;gap:0.5rem;">
          <div style="color:var(--text-muted);font-size:0.82rem;text-align:center;padding:1rem;">Loading...</div>
        </div>

        <!-- Recording Area -->
        <div id="recordingArea" style="display:none;flex-direction:column;gap:1rem;margin-top:0.5rem;">
          <div style="background:rgba(0,0,0,0.3);border-radius:12px;padding:1rem;text-align:center;">
            <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.5rem;">Recording Session</div>
            <div style="font-size:0.9rem;font-weight:600;color:var(--teal);" id="activeSessionName">—</div>
          </div>

          <canvas id="waveformCanvas" width="330" height="60" class="waveform-wrap"></canvas>
          
          <div style="text-align:center;">
            <div class="timer-display" id="recTimer">00:00</div>
            <div style="font-size:0.72rem;color:var(--text-muted);" id="recStatus">Ready to record</div>
          </div>

          <div style="display:flex;justify-content:center;gap:1.5rem;align-items:center;">
            <button class="record-btn idle" id="recordBtn" onclick="toggleRecording()">🎙️</button>
          </div>

          <div id="uploadProgress" style="display:none;">
            <div style="font-size:0.78rem;color:var(--text-sub);margin-bottom:0.5rem;">Processing...</div>
            <div class="progress-bar-wrap">
              <div class="progress-bar" id="progressBar" style="width:0%"></div>
            </div>
          </div>

          <div id="uploadResult" style="display:none;background:var(--teal-dim);border:1px solid rgba(0,229,204,0.2);border-radius:10px;padding:0.75rem;text-align:center;">
            <div style="font-size:0.85rem;color:var(--teal);">✓ Recording uploaded!</div>
            <div style="font-size:0.75rem;color:var(--text-sub);margin-top:0.25rem;" id="recordingIdDisplay"></div>
          </div>
        </div>

        <div class="sidebar-bottom mt-4">
          <button class="btn btn-outline btn-sm w-full" style="justify-content:center;" onclick="appLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- New Session Modal (app) -->
  <div id="appNewSessionModal" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem;">
    <div class="card" style="width:100%;max-width:380px;padding:1.5rem;">
      <div class="flex justify-between items-center mb-4">
        <h3 style="font-size:1.1rem;">New Session</h3>
        <button onclick="closeAppModal()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.75rem;">
        <div class="form-group">
          <label class="form-label" style="font-size:0.72rem;">Session Name</label>
          <input type="text" id="appSessionName" class="form-input" style="font-size:0.85rem;" placeholder="e.g. Team Standup">
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:0.72rem;">Interviewer</label>
          <input type="text" id="appInterviewer" class="form-input" style="font-size:0.85rem;" placeholder="Your name">
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:0.72rem;">Date &amp; Time</label>
          <input type="datetime-local" id="appSessionTime" class="form-input" style="font-size:0.85rem;">
        </div>
        <button class="btn btn-primary w-full" style="justify-content:center;margin-top:0.5rem;" onclick="createAppSession()">Create</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/recorder.js') }}"></script>
</body>
</html>
